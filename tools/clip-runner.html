<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip runner</title>
<script type="importmap">
{ "imports": { "@mediapipe/tasks-vision": "../vendor/mediapipe/vision_bundle.mjs" } }
</script>
</head>
<body>
<!-- Used only by scripts/clip-test.mjs on this computer. Never deployed. Shows nothing and stores nothing. -->
<video id="v" muted playsinline></video>
<script type="module">
import { FilesetResolver, PoseLandmarker, HandLandmarker } from '@mediapipe/tasks-vision';

let pose, hands;
window.initTracking = async (model = 'lite', delegate = 'CPU') => {
  const base = new URL('../vendor/', location.href).href;
  const fileset = await FilesetResolver.forVisionTasks(base + 'mediapipe/wasm');
  pose = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: `${base}models/pose_landmarker_${model}.task`, delegate }, runningMode: 'VIDEO', numPoses: 1 });
  hands = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: `${base}models/hand_landmarker.task`, delegate }, runningMode: 'VIDEO', numHands: 2 });
  return true;
};

let tsBase = 0;
/** Tracks every frame of one clip. Landmarks stay inside this page; only the game's decisions are returned. */
window.trackClip = async (url, fps, settings, calibration, tuning, calibrate) => {
  const { Player } = await import('../src/engine.js');
  const { Calibrator } = await import('../src/calibration.js');
  const v = document.getElementById('v');
  v.crossOrigin = 'anonymous';
  v.src = url;
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('cannot decode ' + url)); });
  const player = new Player(settings, calibration, tuning);
  const calib = calibrate ? new Calibrator(player.cal) : null;
  const n = Math.floor(v.duration * fps);
  const out = [];
  for (let i = 0; i < n; i++) {
    v.currentTime = (i + 0.5) / fps;
    await new Promise(r => { v.onseeked = r; });
    const ts = tsBase + Math.round(i * 1000 / fps);
    const pr = pose.detectForVideo(v, ts);
    const hr = hands.detectForVideo(v, ts);
    const frame = {
      t: i * 1000 / fps, aspect: v.videoWidth / v.videoHeight, pose: pr.landmarks && pr.landmarks[0] || null,
      poseWorld: pr.worldLandmarks && pr.worldLandmarks[0] || null,
      hands: (hr.landmarks || []).map((lm, k) => ({ landmarks: lm, world: hr.worldLandmarks ? hr.worldLandmarks[k] : null })),
    };
    const s = player.update(frame);
    if (calib && !calib.done) calib.update(s.features, player.bow.speed, frame.t);
    const f = s.features;
    out.push({ t: frame.t, body: !!f.ok, hand: !!(f && f.extension), string: s.string, finger: s.finger,
      rawFinger: player.fingers.raw, midi: s.note.midi, amp: +s.amp.toFixed(3), stroke: s.newStroke,
      slideIndex: s.slideIndex ?? null });
  }
  tsBase += Math.round(n * 1000 / fps) + 1000;
  return { frames: out, duration: v.duration, calibration: calib && calib.done ? calib.result : null,
    calibStep: calib ? calib.step : null };
};
window.ready = true;
</script>
</body>
</html>
